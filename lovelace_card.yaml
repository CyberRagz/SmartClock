# =============================================================================
# SMART CLOCK - LOVELACE DASHBOARD CARD
# =============================================================================
# One card. Dashboard -> Edit -> + Add Card -> Manual -> paste from
# "type: vertical-stack".
#
# The "Quick messages" grid needs the smart_clock.yaml package loaded
# (HA restart). Delete that section if you don't use the package - the rest
# runs on the MQTT-discovered entities alone.
#
# Entity ids assume HA slugified the device as smart_clock_<name>. If HA
# appended _2 to any (name collision), fix the ids here.
# =============================================================================

type: vertical-stack
cards:

  # -- live readout --------------------------------------------------------
  - type: markdown
    content: >
      # {{ states('sensor.smart_clock_time') }}

      **{{ states('sensor.smart_clock_date') }}**  ·  showing
      {{ states('sensor.smart_clock_display') }}

  # -- message -----------------------------------------------------------
  - type: entities
    title: Message
    show_header_toggle: false
    entities:
      - entity: text.smart_clock_message
        name: Scroll text
      - entity: number.smart_clock_message_repeats
        name: Repeat count

  # -- one-shot actions -------------------------------------------------
  - type: horizontal-stack
    cards:
      - type: button
        name: Clock
        icon: mdi:clock
        tap_action: { action: toggle }
        entity: button.smart_clock_show_clock
      - type: button
        name: Date
        icon: mdi:calendar
        tap_action: { action: toggle }
        entity: button.smart_clock_show_date
      - type: button
        name: Restart
        icon: mdi:restart
        tap_action: { action: toggle }
        entity: button.smart_clock_restart

  # -- display settings ------------------------------------------------
  - type: entities
    title: Display
    show_header_toggle: false
    entities:
      - entity: number.smart_clock_brightness
        name: Brightness (day)
      - entity: number.smart_clock_night_brightness
        name: Brightness (night)
      - entity: switch.smart_clock_night_dimming
        name: Night dimming (22:00-07:00)
      - entity: switch.smart_clock_12_hour_format
        name: 12-hour face

  # -- quick messages (needs smart_clock.yaml package) ----------------
  - type: grid
    columns: 2
    square: false
    cards:
      - type: button
        name: Weather
        icon: mdi:weather-partly-cloudy
        tap_action:
          action: perform-action
          perform_action: script.smart_clock_show_weather
      - type: button
        name: Air / CO2
        icon: mdi:molecule-co2
        tap_action:
          action: perform-action
          perform_action: script.smart_clock_show_air
      - type: button
        name: Light
        icon: mdi:brightness-5
        tap_action:
          action: perform-action
          perform_action: script.smart_clock_show_light
      - type: button
        name: Preset
        icon: mdi:message-fast
        tap_action:
          action: perform-action
          perform_action: script.smart_clock_show_preset
      - type: button
        name: Random Quote
        icon: mdi:comment-quote
        tap_action:
          action: perform-action
          perform_action: automation.trigger
          target:
            entity_id: automation.smart_clock_random_quote
      - type: button
        name: Date scroll
        icon: mdi:calendar-clock
        tap_action:
          action: perform-action
          perform_action: script.smart_clock_show_date

  # -- diagnostics ---------------------------------------------------
  - type: entities
    title: Diagnostics
    show_header_toggle: false
    entities:
      - entity: sensor.smart_clock_wi_fi_signal
        name: Wi-Fi signal
      - entity: sensor.smart_clock_ip_address
        name: IP
      - entity: sensor.smart_clock_mac_address
        name: MAC
      - entity: sensor.smart_clock_uptime
        name: Uptime
      - entity: sensor.smart_clock_free_heap
        name: Free heap
      - entity: sensor.smart_clock_wi_fi_reconnects
        name: Wi-Fi reconnects
