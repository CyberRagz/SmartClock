# =============================================================================
# STUDY CLOCK - HOME ASSISTANT PACKAGE
# =============================================================================
# Convenience scripts that push Home Assistant entity data to the Study Clock's
# scrolling display (MQTT topic study_clock/cmd/message). The clock itself is
# already auto-discovered over MQTT - this package only adds the "show sensor X"
# helpers and a few presets.
#
# Install: drop this file in your packages folder and make sure configuration.yaml
# has:
#   homeassistant:
#     packages: !include_dir_named packages/
#
# >>> EDIT THE ENTITY IDs BELOW to match your own sensors. <<<
# The clock font is ASCII-only (use "C", not the degree symbol) and messages
# are capped at 100 characters.
# =============================================================================


# -----------------------------------------------------------------------------
# INPUT HELPERS
# -----------------------------------------------------------------------------

input_text:
  study_clock_message:
    name: "Study Clock Custom Message"
    initial: ""
    max: 100
    icon: mdi:message-text

input_select:
  study_clock_presets:
    name: "Study Clock Presets"
    options:
      - "Good Morning"
      - "Focus Time"
      - "Break Time"
      - "Wrap Up"
      - "Good Night"
    initial: "Focus Time"
    icon: mdi:message-text-outline


# -----------------------------------------------------------------------------
# SCRIPTS
# -----------------------------------------------------------------------------

script:

  # --- free text / presets -------------------------------------------------

  study_clock_show_message:
    alias: "Study Clock - Show Custom Message"
    icon: mdi:send
    sequence:
      - action: mqtt.publish
        data:
          topic: "study_clock/cmd/message"
          payload: "{{ states('input_text.study_clock_message') }}"

  study_clock_show_preset:
    alias: "Study Clock - Show Preset"
    icon: mdi:message-fast
    sequence:
      - action: mqtt.publish
        data:
          topic: "study_clock/cmd/message"
          payload: "{{ states('input_select.study_clock_presets') }}"

  # --- sensor read-outs --------------------------------------------------
  # Indoor climate now comes from the clock's own DHT22 - the firmware has a
  # built-in "Show Climate" button (button.study_clock_show_climate) that
  # scrolls "24.5C  55%" directly. This script is the same thing via HA.
  # Replace the outdoor / weather entity_ids with your own.

  study_clock_show_indoor_climate:
    alias: "Study Clock - Show Indoor Climate"
    icon: mdi:home-thermometer
    sequence:
      - action: button.press
        target:
          entity_id: button.study_clock_show_climate

  study_clock_show_humidity:
    alias: "Study Clock - Show Humidity"
    icon: mdi:water-percent
    sequence:
      - variables:
          v: "{{ states('sensor.study_clock_humidity') }}"
      - action: mqtt.publish
        data:
          topic: "study_clock/cmd/message"
          payload: >-
            {% if v in ['unknown', 'unavailable', 'none'] %}
            Humidity N/A
            {% else %}
            Humidity {{ '%.0f' % (v | float) }} pct
            {% endif %}

  # --- Home Weather Station (ESPHome device "Home Weather Station") --------
  # Confirmed entity ids: sensor.home_weather_station_barometric_pressure,
  # _pressure_trend (numeric hPa/3h), _ambient_light. CO2 / air-quality-rating
  # slugs follow the same pattern - verify in Developer Tools -> States.

  study_clock_show_weather:
    alias: "Study Clock - Show Weather"
    icon: mdi:weather-partly-cloudy
    sequence:
      - variables:
          p: "{{ states('sensor.home_weather_station_barometric_pressure') | float(0) }}"
          d: "{{ states('sensor.home_weather_station_pressure_trend') | float(0) }}"
      - variables:
          label: "{% if d >= 1 %}Rising{% elif d <= -1 %}Falling{% else %}Steady{% endif %}"
      - action: mqtt.publish
        data:
          topic: "study_clock/cmd/message"
          payload: >-
            {% if p == 0 %}Weather station offline{% else %}{{ '%.0f' % p }} hPa {{ label }} ({{ '%+.1f' % d }}/3h){% endif %}

  study_clock_show_air:
    alias: "Study Clock - Show Air Quality"
    icon: mdi:molecule-co2
    sequence:
      - variables:
          co2: "{{ states('sensor.home_weather_station_co2') }}"
          rating: "{{ states('sensor.home_weather_station_air_quality_rating') }}"
      - action: mqtt.publish
        data:
          topic: "study_clock/cmd/message"
          payload: >-
            {% if co2 in ['unknown', 'unavailable', 'none'] %}
            Air quality N/A
            {% else %}
            CO2 {{ '%.0f' % (co2 | float) }} ppm
            {%- if rating not in ['unknown','unavailable','none'] %} - {{ rating }}{% endif %}
            {% endif %}

  study_clock_show_light:
    alias: "Study Clock - Show Ambient Light"
    icon: mdi:brightness-5
    sequence:
      - variables:
          lx: "{{ states('sensor.home_weather_station_ambient_light') | float(-1) }}"
      - action: mqtt.publish
        data:
          topic: "study_clock/cmd/message"
          payload: >-
            {% if lx < 0 %}Light N/A
            {% elif lx >= 1000 %}Light {{ '%.1f' % (lx / 1000) }} klx
            {% else %}Light {{ '%.0f' % lx }} lx{% endif %}

  # --- clock control -----------------------------------------------------

  study_clock_show_date:
    alias: "Study Clock - Show Date"
    icon: mdi:calendar
    sequence:
      - action: mqtt.publish
        data:
          topic: "study_clock/cmd/show_date"
          payload: "1"

  study_clock_return_to_clock:
    alias: "Study Clock - Return to Clock"
    icon: mdi:clock
    sequence:
      - action: mqtt.publish
        data:
          topic: "study_clock/cmd/reset"
          payload: "1"

  study_clock_set_brightness:
    alias: "Study Clock - Set Brightness"
    icon: mdi:brightness-6
    fields:
      brightness:
        description: "Brightness level (0-15)"
        example: "8"
    sequence:
      - action: mqtt.publish
        data:
          topic: "study_clock/cmd/brightness"
          payload: "{{ brightness | default(6) }}"


# -----------------------------------------------------------------------------
# AUTOMATIONS
# -----------------------------------------------------------------------------

automation:

  # Every 5 minutes, scroll one of four random quotes.
  - alias: "Study Clock - random quote"
    id: study_clock_random_quote
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    actions:
      - action: mqtt.publish
        data:
          topic: "study_clock/cmd/message"
          payload: >-
            {{
              [
                "If you see a shooting star what will you wish for?",
                "Relax, tomorrow is another day.",
                "If you have not learnt anything new today, you still have time.",
                "You have a future in your past."
              ] | random
            }}

